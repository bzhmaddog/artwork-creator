# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=bzhmaddog
sonar.projectKey=bzhmaddog_artwork-creator
sonar.projectName=artwork-creator

sonar.sources=src,plugin-sdk/src,plugin-sdk/python/artwork_plugin_sdk.py,plugin-examples/halftone/src,plugin-examples/python,scripts/download-page.py
sonar.sourceEncoding=UTF-8

# Test modules kept in their own files (tests.rs, and the gallery drawing docs/*.png)
# are test code; the other tests are #[cfg(test)]
# modules inside the source files, which Sonar cannot tell apart.
sonar.tests=src,scripts/test_download_page.py,plugin-sdk/python/test_artwork_plugin_sdk.py
sonar.test.inclusions=src/**/tests.rs,src/ui/gallery.rs,scripts/test_download_page.py,plugin-sdk/python/test_artwork_plugin_sdk.py
sonar.exclusions=src/**/tests.rs,src/ui/gallery.rs

# Not measurable on the Linux runner: the entry point, and the Windows printing code
# that is only compiled on Windows.
sonar.coverage.exclusions=src/main.rs,src/export/printing/windows.rs

# Reports produced by the workflow before the scan.
sonar.rust.clippy.reportPaths=target/clippy.json
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.python.coverage.reportPaths=target/python-coverage.xml
