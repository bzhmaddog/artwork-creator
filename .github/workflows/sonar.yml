# SonarQube Cloud analysis with Clippy findings and test coverage, on every push to main
# and every pull request. Needs the SONAR_TOKEN repository secret.
name: Sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sonar can tell new code from old and blame lines.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Clippy report
        run: mkdir -p target && cargo clippy --workspace --all-targets --locked --message-format=json > target/clippy.json
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path target/lcov.info
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
