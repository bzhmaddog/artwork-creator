# Publishes the project's web page (the pages/ folder) to GitHub Pages.
#
# The app icon and the screenshot are copied in from assets/ and docs/ so they are kept
# in one place. The Windows installer of every published release is added under
# download/vX.Y.Z/, a direct link without redirects (unlike release assets) for the
# Microsoft Store. The download page (pages/download.html) is filled in with the latest
# release's files and the older releases (scripts/download-page.py), and version.json with
# that release's version, which the app reads to tell about a new version. Runs on every push to main that touches them, when a release is
# published, or by hand (Actions > Pages > Run workflow).
#
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "scripts/download-page.py"
      - "assets/icon/artwork-creator.svg"
      - "docs/capture.png"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than canceling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r pages/. _site/
          cp assets/icon/artwork-creator.svg _site/icon.svg
          cp docs/capture.png _site/capture.png
      # Each deployment replaces the whole site, so every release's installer is added again.
      - name: Add the Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -p artwork-creator-windows-setup.exe -D "_site/download/$tag" \
              || echo "$tag has no Windows installer"
          done
      - name: Fill in the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/${{ github.repository }}/releases" | jq 'add // []' > "$releases"
          python3 -I scripts/download-page.py < "$releases" > _site/download.html
          # version.json only when there is a stable release: the app says nothing without it.
          version=$(python3 -I scripts/download-page.py --version < "$releases")
          if [ -n "$version" ]; then printf '%s\n' "$version" > _site/version.json; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
