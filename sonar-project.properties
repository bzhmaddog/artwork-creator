# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=bzhmaddog
sonar.projectKey=bzhmaddog_artwork-creator
sonar.projectName=artwork-creator

sonar.sources=src,plugin-sdk/src,plugin-examples/halftone/src
sonar.sourceEncoding=UTF-8

# Test modules kept in their own files are test code; the other tests are #[cfg(test)]
# modules inside the source files, which Sonar cannot tell apart.
sonar.tests=src
sonar.test.inclusions=src/**/tests.rs
sonar.exclusions=src/**/tests.rs

# Not measurable on the Linux runner: the entry point, and the Windows printing code
# that is only compiled on Windows.
sonar.coverage.exclusions=src/main.rs,src/export/printing/windows.rs

# Reports produced by the workflow before the scan.
sonar.rust.clippy.reportPaths=target/clippy.json
sonar.rust.lcov.reportPaths=target/lcov.info
