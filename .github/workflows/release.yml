# Release builds for Linux and Windows, packaged like `make dist` (the executable with
# its templates folder next to it), and as installers: a setup .exe for Windows (Inno
# Setup, installer/artwork-creator.iss), a .deb and an AppImage for Linux (`make deb`,
# `make appimage`).
#
# - Pushing a version tag (vX.Y.Z, made by hand) builds both and attaches them
#   to a draft GitHub Release for that tag, to look over and publish by hand.
# - Run by hand (Actions > Release > Run workflow), it only builds them: the packages are
#   the run's artifacts, kept for a few days.
#
# The release steps: doc/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP: artwork-creator

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            exe: artwork-creator
          - name: windows
            os: windows-latest
            exe: artwork-creator.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      # Linux: linked against an old glibc (GLIBC in the Makefile, like `make linux-portable`)
      # so the packages run on older distributions too, with cargo-zigbuild and zig at
      # pinned versions (zig checked against its SHA-256); raise them on purpose.
      - name: Build (Linux)
        if: matrix.name == 'linux'
        env:
          ZIG_VERSION: 0.14.1
          ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
        run: |
          zig="zig-x86_64-linux-$ZIG_VERSION"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$zig:$PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked
          glibc=$(sed -n 's/^GLIBC *:= *//p' Makefile)
          cargo zigbuild --release --locked -p "$APP" --target "x86_64-unknown-linux-gnu.$glibc"
          mkdir -p target/release
          cp "target/x86_64-unknown-linux-gnu/release/${{ matrix.exe }}" target/release/
      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: cargo build --release --locked -p ${{ env.APP }}
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          dir="$APP-linux"
          mkdir -p "dist/$dir"
          cp "target/release/${{ matrix.exe }}" "dist/$dir/"
          cp -r templates "dist/$dir/"
          tar -czf "dist/$dir.tar.gz" -C dist "$dir"
      - name: Installers (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb --no-build --target x86_64-unknown-linux-gnu -o dist/
          sh scripts/appimage.sh "target/release/${{ matrix.exe }}" "dist/$APP-linux-x86_64.AppImage"
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dir = "$env:APP-windows"
          New-Item -ItemType Directory -Force "dist/$dir" | Out-Null
          Copy-Item "target/release/${{ matrix.exe }}" "dist/$dir/"
          Copy-Item -Recurse templates "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"
      # Inno Setup at a pinned version, checked against its SHA-256; raise it on purpose.
      - name: Installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          INNO_VERSION: 6.7.4
          INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          $tag = "is-" + $env:INNO_VERSION.Replace(".", "_")
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch" }
          $inno = "$env:RUNNER_TEMP\inno"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$inno"
          $iscc = "$inno\ISCC.exe"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$version" installer/artwork-creator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The tag must be the version in Cargo.toml, as `make version-bump-*` sets it.
      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A published release is immutable (repository setting): its assets can only be
        # attached while it is a draft. So push the tag and let this job make the draft;
        # don't publish a release for the tag on GitHub first.
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published, so the binaries can't be attached. Publish only the draft this workflow creates."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
