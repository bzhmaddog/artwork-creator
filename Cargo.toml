[package]
name = "artwork-creator"
version = "0.1.0"
edition = "2024"
description = "Design printable artwork for arcade controllers on DXF templates, with print-ready PNG/PDF export"
license-file = "LICENSE"
publish = false

# The plugin SDK and the example plugin live in the same workspace; see "Plugins" in README.md.
[workspace]
members = [".", "plugin-sdk", "plugin-examples/halftone"]

[dependencies]
artwork-plugin-sdk = { path = "plugin-sdk" }
# Text layers: system fonts, shaping and glyph outlines; the same crates egui uses. The
# monochrome emoji fonts are the last fallback for characters no other font has.
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
dxf = "0.6"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
tiny-skia = "0.12"
printpdf = { version = "0.12", default-features = false }
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# On Wayland (e.g. WSLg) the window draws its own title bar. eframe leaves out winit's
# decorations, so without this the bar has no title text.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Debug builds lightly optimized: effects and text are computed on the CPU while you
# edit, and unoptimized they take seconds on large layers. Set 0 for the best debugging.
[profile.dev]
opt-level = 1

# Keep rendering fast in debug builds: the canvas composites semi-transparent groups on the CPU.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3
