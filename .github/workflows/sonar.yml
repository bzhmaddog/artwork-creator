# SonarQube Cloud analysis with Clippy findings and test coverage, on every push to main
# and every pull request. Needs the SONAR_TOKEN repository secret.
name: Sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so there is no SONAR_TOKEN to scan with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sonar can tell new code from old and blame lines.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov
      - name: Clippy report
        run: mkdir -p target && cargo clippy --workspace --all-targets --locked --message-format=json > target/clippy.json
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path target/lcov.info
      - name: Python coverage
        run: |
          pip install --only-binary :all: coverage==7.17.4
          sh scripts/python-coverage.sh
          coverage xml --data-file=target/.coverage -o target/python-coverage.xml
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "artwork-creator") | .version')" >> "$GITHUB_OUTPUT"
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Tags each analysis with the release, for the "previous version" new code period.
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
