[package]
name = "artwork-creator"
version = "0.17.0"
edition = "2024"
description = "Design printable artwork for arcade controllers on DXF templates, with print-ready PNG/PDF export"
license-file = "LICENSE"
homepage = "https://github.com/bzhmaddog/artwork-creator-app"
publish = false

# The plugin SDK lives in the same workspace; see "Plugins" in README.md.
[workspace]
members = [".", "plugin-sdk"]

[dependencies]
artwork-plugin-sdk = { path = "plugin-sdk" }
# Text layers: system fonts, shaping and glyph outlines; the same crates egui uses. The
# monochrome emoji fonts are the last fallback for characters no other font has.
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
dxf = "0.6"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
tiny-skia = "0.12"
printpdf = { version = "0.12", default-features = false }
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plugin repositories: what a plugin version needs of the app, as version requirements.
semver = "1"
sys-locale = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Polygon offsets: the outline grown by the bleed, shrunk to the safe area.
i_overlay = "9.1"
# SVG import: the shapes and how they are painted, nothing loaded from elsewhere (no
# images, no fonts: no text).
usvg = { version = "0.49", default-features = false, features = ["svgz"] }
# SVG export: images embedded in the file as PNG data URLs.
base64 = "0.22"
resvg = { version = "0.49", default-features = false }
hayro = "0.9"
# Python plugins are allowed by the SHA-256 of their content.
sha2 = "0.11"
ureq = "3"

# On Wayland (e.g. WSLg) the window draws its own title bar. eframe leaves out winit's
# decorations, so without this the bar has no title text.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

# Printing on Windows: the system print dialog and GDI. The dialog belongs to the app's
# window, found through its raw handle.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The Linux .deb package (`make deb`, cargo-deb). The app finds its templates in
# ../share/artwork-creator/ from the executable, and the Python of the Python plugins
# (target/python-linux, scripts/python-linux.sh) in ../lib/artwork-creator/python/. The release build links only to glibc,
# at the version it is built for (GLIBC in the Makefile; $auto would ask for the build
# machine's); the other libraries are loaded at run time (OpenGL, X11 or Wayland, fontconfig).
[package.metadata.deb]
maintainer = "bzhmaddog"
copyright = "bzhmaddog"
section = "graphics"
extended-description = "A desktop app for designing printed artwork for arcade controllers and fightsticks: load a controller template, arrange images on it and export print-ready PNG, PDF or SVG at true size."
depends = "libc6 (>= 2.28), libgl1, libegl1, libfontconfig1, libxkbcommon0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2"
assets = [
    ["target/release/artwork-creator", "usr/bin/", "755"],
    ["templates/**/*", "usr/share/artwork-creator/templates/", "644"],
    ["target/python-linux/bin/python3", "usr/lib/artwork-creator/python/bin/", "755"],
    ["target/python-linux/lib/**/*", "usr/lib/artwork-creator/python/lib/", "644"],
    ["assets/artwork-creator.desktop", "usr/share/applications/", "644"],
    ["assets/icon/artwork-creator.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/icon/png/artwork-creator-256.png", "usr/share/icons/hicolor/256x256/apps/artwork-creator.png", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Debug builds lightly optimized: effects and text are computed on the CPU while you
# edit, and unoptimized they take seconds on large layers. Set 0 for the best debugging.
[profile.dev]
opt-level = 1

# Keep rendering fast in debug builds: the canvas composites semi-transparent groups on the CPU.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[dev-dependencies]
ron = "0.12"
