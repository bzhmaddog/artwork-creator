# Publishes the project's web page (the pages/ folder) to GitHub Pages.
#
# The app icon and the screenshot are copied in from assets/ and docs/ so they are kept
# in one place. The Windows installer of every published release is added under
# download/vX.Y.Z/, a direct link without redirects (unlike release assets) for the
# Microsoft Store. The download page (pages/download.html) is filled in with the latest
# release's files and the older releases (scripts/download-page.py); version.json with the
# latest stable release's version and version-dev.json with the latest release's, pre-release
# or not, which the app reads to tell about a new version (its stable and dev update
# channels).
#
# Runs only when a release is published, a pre-release or not (the "published" event is
# both), or by hand (Actions > Pages > Run workflow). Not on pushes to main: Pages keeps the
# files of the first deployment of a commit and ignores a later one of the same commit,
# though it reports success, and a release is tagged on the commit main was just merged to.
# Deploying on that push left the release's own deployment without effect. A change to the
# page goes live with the next release, or a run by hand.
#
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Pages

on:
  release:
    # Pre-releases too: "published" is the event of both ("released" would leave them out).
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than canceling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r pages/. _site/
          cp assets/icon/artwork-creator.svg _site/icon.svg
          cp docs/capture.png _site/capture.png
      # Each deployment replaces the whole site, so every release's installer is added again.
      - name: Add the Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -p artwork-creator-windows-setup.exe -D "_site/download/$tag" \
              || echo "$tag has no Windows installer"
          done
      - name: Fill in the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/${{ github.repository }}/releases" | jq 'add // []' > "$releases"
          python3 -I scripts/download-page.py --version-files _site < "$releases" > _site/download.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
